name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_agentic_rag
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with black
      run: |
        pip install black
        black --check app/ || true
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy app/ --ignore-missing-imports || true
    
    - name: Run unit tests
      env:
        DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_agentic_rag"
        REDIS_URL: "redis://localhost:6379"
        LLM_PROVIDER: "mock"
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Bandit security scan
      run: bandit -r app/ -f json -o bandit-report.json || true
    
    - name: Safety check for vulnerable dependencies
      run: safety check --json || true

  build-and-push-docker:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      if: secrets.DOCKER_HUB_USERNAME != ''
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-rag-assistant:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/agentic-rag-assistant:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/agentic-rag-assistant:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/agentic-rag-assistant:buildcache,mode=max
      if: secrets.DOCKER_HUB_USERNAME != ''
    
    - name: Build Docker image (no push)
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
      if: secrets.DOCKER_HUB_USERNAME == ''

  deploy-streamlit-cloud:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Trigger Streamlit Cloud deployment
      run: |
        echo "Streamlit Cloud auto-deployment triggered"
        echo "App URL: https://share.streamlit.io/<username>/<repo>/<branch>"
      # Note: Streamlit Cloud auto-deploys on main branch push if connected to GitHub

  integration-tests:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_agentic_rag
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run integration tests
      env:
        DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_agentic_rag"
        REDIS_URL: "redis://localhost:6379"
        LLM_PROVIDER: "mock"
      run: |
        pip install pytest pytest-asyncio
        pytest tests/integration/ -v || true
