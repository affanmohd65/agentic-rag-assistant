version: '3.9'

services:
  # PostgreSQL for semantic memory
  postgres:
    image: postgres:15-alpine
    container_name: agentic_rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: agentic_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: agentic_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for local LLM (optional)
  ollama:
    image: ollama/ollama:latest
    container_name: agentic_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    # Run: docker exec agentic_rag_ollama ollama pull mistral

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agentic_rag_jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI

  # FastAPI Backend
  api:
    build: .
    container_name: agentic_rag_api
    environment:
      DATABASE_URL: "postgresql://rag_user:rag_password@postgres:5432/agentic_rag"
      REDIS_URL: "redis://redis:6379"
      OLLAMA_BASE_URL: "http://ollama:11434"
      JAEGER_HOST: "jaeger"
      JAEGER_PORT: "6831"
        OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
      LANGFUSE_ENABLED: "false"  # Enable with API keys if needed
      LLM_PROVIDER: "ollama"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app
      - ./data:/app/data

  # Streamlit UI
  streamlit:
    build: .
    container_name: agentic_rag_streamlit
    environment:
      DATABASE_URL: "postgresql://rag_user:rag_password@postgres:5432/agentic_rag"
      REDIS_URL: "redis://redis:6379"
      OLLAMA_BASE_URL: "http://ollama:11434"
      LLM_PROVIDER: "ollama"
    ports:
      - "8501:8501"
    depends_on:
      - api
      - postgres
      - redis
    command: ["streamlit", "run", "streamlit_app.py"]
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./data:/app/data

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: agentic_rag_network
